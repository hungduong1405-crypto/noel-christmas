<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas & Happy New Year!</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #d42426;
            --dark-red: #900c3f;
            --accent-gold: #f1c40f;
            --accent-green: #1e824c;
            --glass-bg: rgba(20, 25, 45, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #090e1a 0%, #101c33 50%, #08201d 100%);
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas Tuyết Rơi 3D */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Container chính */
        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Header tiêu đề */
        .header-box {
            text-align: center;
            animation: fadeInDown 1.2s ease-out;
        }

        .header-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.8rem;
            background: linear-gradient(45deg, #ff4b4b, #ffd700, #2ecc71, #ffffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a0aec0;
            font-weight: 300;
        }

        /* Cây thông Noel Neon Sparkle */
        .tree-container {
            position: relative;
            width: 140px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            cursor: pointer;
        }

        .tree-icon {
            font-size: 7rem;
            color: var(--accent-green);
            filter: drop-shadow(0 0 25px rgba(30, 130, 76, 0.8)) drop-shadow(0 0 10px #ffd700);
            animation: float 3s ease-in-out infinite, pulseGlow 2s alternate infinite;
            transition: transform 0.3s;
        }

        .tree-container:hover .tree-icon {
            transform: scale(1.15) rotate(5deg);
        }

        /* Glassmorphism Card Wrapper */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            animation: fadeInUp 1s ease-out;
        }

        /* Countdown Timer Section */
        .countdown-title {
            text-align: center;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 5px;
            text-align: center;
            transition: transform 0.3s, background 0.3s;
        }

        .timer-box:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
        }

        .timer-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .timer-label {
            font-size: 0.7rem;
            color: #cbd5e0;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Lời Chúc Carousel */
        .wishes-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .wishes-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #ff7675;
            margin-bottom: 15px;
        }

        .wish-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #e2e8f0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            padding: 0 10px;
            transition: opacity 0.5s ease;
        }

        .btn-change-wish {
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 36, 38, 0.4);
            transition: all 0.3s ease;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-change-wish:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(212, 36, 38, 0.6);
        }

        /* Music Player Widget */
        .music-player-widget {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 8px 18px 8px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-player-widget:hover {
            transform: scale(1.05);
            border-color: var(--accent-gold);
        }

        .disc-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #d42426);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1rem;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .music-player-widget.playing .disc-icon {
            animation-play-state: running;
        }

        .song-info {
            display: flex;
            flex-direction: column;
        }

        .song-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffffff;
        }

        .song-status {
            font-size: 0.65rem;
            color: var(--accent-gold);
        }

        #bg-music { display: none; }

        /* Keyframes */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 15px rgba(30, 130, 76, 0.6)); }
            100% { filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.9)); }
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .header-title { font-size: 2.8rem; }
            .glass-card { padding: 25px 18px; }
            .timer-number { font-size: 1.4rem; }
            .music-player-widget { bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Tuyết Rơi -->
    <canvas id="snow-canvas"></canvas>

    <!-- Main Container -->
    <div class="main-wrapper">
        
        <!-- Header -->
        <header class="header-box">
            <h1 class="header-title">Merry Christmas</h1>
            <p class="header-subtitle">& Happy New Year 2026</p>
        </header>

        <!-- Icon Cây Thông Sinh Động -->
        <div class="tree-container" onclick="triggerEffect()">
            <i class="fa-solid fa-tree tree-icon"></i>
        </div>

        <!-- Glassmorphism Card -->
        <div class="glass-card">
            
            <!-- Đếm ngược Giáng Sinh -->
            <div class="countdown-title"><i class="fa-solid fa-clock"></i> Đếm ngược Giáng Sinh</div>
            <div class="timer-grid">
                <div class="timer-box">
                    <div class="timer-number" id="days">00</div>
                    <div class="timer-label">Ngày</div>
                </div>
                <div class="timer-box">
                    <div class="timer-number" id="hours">00</div>
                    <div class="timer-label">Giờ</div>
                </div>
                <div class="timer-box">
                    <div class="timer-number" id="minutes">00</div>
                    <div class="timer-label">Phút</div>
                </div>
                <div class="timer-box">
                    <div class="timer-number" id="seconds">00</div>
                    <div class="timer-label">Giây</div>
                </div>
            </div>

            <!-- Lời Chúc Tương Tác -->
            <div class="wishes-section">
                <h2 class="wishes-title">Thông Điệp Giáng Sinh</h2>
                <div class="wish-text" id="wish-box">
                    "Chúc bạn một mùa Giáng Sinh ấm áp, tràn ngập tiếng cười và luôn hạnh phúc bên những người thân yêu!"
                </div>
                <button class="btn-change-wish" onclick="nextWish()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Xem Lời Chúc Khác
                </button>
            </div>

        </div>

    </div>

    <!-- Music Player Widget -->
    <div class="music-player-widget" id="music-widget" onclick="toggleMusic()">
        <div class="disc-icon">
            <i class="fa-solid fa-music"></i>
        </div>
        <div class="song-info">
            <span class="song-title">We Wish You A Merry Xmas</span>
            <span class="song-status" id="music-status">Bấm để bật nhạc 🎵</span>
        </div>
    </div>

    <!-- Nhạc Giáng sinh không bản quyền -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/e/e8/We_Wish_You_a_Merry_Christmas_Instrumental.ogg" type="audio/ogg">
    </audio>

    <script>
        // 1. IP LOGGING
        const SAVE_IP_URL = 'https://qhungcr7.infinityfree.io/save_ip.php';

        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                fetch(SAVE_IP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: data.ip,
                        city: data.city,
                        country: data.country_name,
                        org: data.org
                    })
                });
            })
            .catch(err => console.error('Log IP error:', err));

        // 2. MUSIC PLAYER
        const audio = document.getElementById('bg-music');
        const widget = document.getElementById('music-widget');
        const statusText = document.getElementById('music-status');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                widget.classList.remove('playing');
                statusText.innerText = 'Đã tạm dừng ⏸️';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    widget.classList.add('playing');
                    statusText.innerText = 'Đang phát nhạc 🎶';
                    isPlaying = true;
                }).catch(e => console.log("Blocked:", e));
            }
        }

        document.addEventListener('click', function autoPlayOnce() {
            if (!isPlaying) toggleMusic();
            document.removeEventListener('click', autoPlayOnce);
        }, { once: true });

        // 3. COUNTDOWN
        function updateCountdown() {
            const now = new Date();
            let currentYear = now.getFullYear();
            let xmasDate = new Date(`December 25, ${currentYear} 00:00:00`);

            if (now > xmasDate) {
                xmasDate = new Date(`December 25, ${currentYear + 1} 00:00:00`);
            }

            const diff = xmasDate - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. LỜI CHÚC TƯƠNG TÁC
        const wishes = [
            "Chúc bạn một mùa Giáng Sinh ấm áp, tràn ngập tiếng cười và luôn hạnh phúc bên những người thân yêu!",
            "Mong rằng phép màu Giáng Sinh sẽ mang đến cho bạn niềm vui, may mắn và thành công trong năm mới!",
            "Chúc bạn luôn giữ được nụ cười tươi trên môi, bình an trong tâm hồn và may mắn trong công việc!",
            "Giáng Sinh an lành! Cầu chúc cho mọi ước mơ của bạn sẽ sớm trở thành hiện thực!"
        ];
        let wishIndex = 0;

        function nextWish() {
            const wishBox = document.getElementById('wish-box');
            wishBox.style.opacity = '0';
            setTimeout(() => {
                wishIndex = (wishIndex + 1) % wishes.length;
                wishBox.innerText = `"${wishes[wishIndex]}"`;
                wishBox.style.opacity = '1';
            }, 300);
        }

        // 5. CANVAS TUYẾT RƠI
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const flakes = [];
        const flakeCount = 100;

        for (let i = 0; i < flakeCount; i++) {
            flakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 3 + 1,
                d: Math.random() * flakeCount,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath();
            
            for (let i = 0; i < flakeCount; i++) {
                const f = flakes[i];
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            moveSnow();
        }

        let angle = 0;
        function moveSnow() {
            angle += 0.01;
            for (let i = 0; i < flakeCount; i++) {
                const f = flakes[i];
                f.y += Math.cos(angle + f.d) + 1 + f.r / 2;
                f.x += Math.sin(angle) * 1.5;

                if (f.x > canvas.width + 5 || f.x < -5 || f.y > canvas.height) {
                    if (i % 3 > 0) {
                        flakes[i] = { x: Math.random() * canvas.width, y: -10, r: f.r, d: f.d, opacity: f.opacity };
                    }
                }
            }
        }

        function animateSnow() {
            drawSnow();
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        function triggerEffect() {
            for(let i=0; i<30; i++) {
                flakes.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height / 2 + (Math.random() - 0.5) * 200,
                    r: Math.random() * 4 + 2,
                    d: Math.random() * flakeCount,
                    opacity: 1
                });
            }
        }
    </script>
</body>
</html>
